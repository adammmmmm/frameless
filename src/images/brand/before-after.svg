<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A1030" flood-opacity="0.35"/></filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A2BE2"/><stop offset="0.55" stop-color="#5B21C9"/><stop offset="1" stop-color="#2E1BA8"/></linearGradient>
    <clipPath id="cl"><rect width="380" height="280" rx="12"/></clipPath>
    <clipPath id="cr"><rect width="380" height="280" rx="12"/></clipPath>
    <!-- shared page content: search box, tabs row, results -->
    <g id="page">
      <rect width="380" height="300" fill="#FFFFFF"/>
      <rect x="24" y="28" width="150" height="12" rx="4" fill="#E4E1EA"/>
      <rect x="24" y="52" width="300" height="7" rx="3.5" fill="#EEECF2"/>
      <rect x="24" y="66" width="260" height="7" rx="3.5" fill="#EEECF2"/>
      <rect x="24" y="80" width="280" height="7" rx="3.5" fill="#EEECF2"/>
    </g>
  </defs>
  <rect width="960" height="360" rx="20" fill="#F7F5FA"/>

  <!-- BEFORE: tab strip + omnibox + bookmarks bar -->
  <g transform="translate(40,36)" filter="url(#sh)">
    <rect width="380" height="280" rx="12" fill="#FFFFFF"/>
    <g clip-path="url(#cl)">
      <!-- tab strip -->
      <rect width="380" height="30" fill="#202124"/>
      <circle cx="16" cy="15" r="4.5" fill="#FF5F57"/><circle cx="30" cy="15" r="4.5" fill="#FEBC2E"/><circle cx="44" cy="15" r="4.5" fill="#28C840"/>
      <rect x="58" y="6" width="12" height="18" rx="4" fill="#2C2D31"/>
      <path d="M76 30V12a6 6 0 0 1 6-6h84a6 6 0 0 1 6 6v18z" fill="#35363A"/>
      <circle cx="90" cy="18" r="4" fill="#8AB4F8"/><rect x="100" y="15" width="52" height="6" rx="3" fill="#C9BFD6"/><rect x="160" y="15" width="6" height="6" rx="1" fill="#8A8D94"/>
      <rect x="182" y="13" width="10" height="2" rx="1" fill="#8A8D94"/><rect x="186" y="9" width="2" height="10" rx="1" fill="#8A8D94"/>
      <!-- omnibox row -->
      <rect y="30" width="380" height="34" fill="#35363A"/>
      <circle cx="16" cy="47" r="1.6" fill="#8A8D94"/><circle cx="30" cy="47" r="1.6" fill="#8A8D94"/><circle cx="44" cy="47" r="1.6" fill="#8A8D94"/>
      <rect x="58" y="38" width="240" height="18" rx="9" fill="#202124"/><rect x="70" y="45" width="170" height="4" rx="2" fill="#8A8D94"/>
      <rect x="306" y="42" width="8" height="8" rx="2" fill="#8A8D94"/><rect x="320" y="42" width="8" height="8" rx="2" fill="#8A8D94"/><rect x="334" y="42" width="8" height="8" rx="2" fill="#8A8D94"/><rect x="348" y="42" width="8" height="8" rx="2" fill="#8A8D94"/><circle cx="368" cy="46" r="4" fill="#8AB4F8"/>
      <!-- bookmarks bar -->
      <rect y="64" width="380" height="24" fill="#35363A"/>
      <g fill="#8A8D94"><rect x="14" y="73" width="36" height="5" rx="2.5"/><rect x="58" y="73" width="44" height="5" rx="2.5"/><rect x="110" y="73" width="40" height="5" rx="2.5"/><rect x="158" y="73" width="48" height="5" rx="2.5"/><rect x="214" y="73" width="38" height="5" rx="2.5"/><rect x="260" y="73" width="44" height="5" rx="2.5"/><rect x="332" y="73" width="34" height="5" rx="2.5"/></g>
      
      <!-- page -->
      <use href="#page" y="88"/>
    </g>
  </g>
  <text x="230" y="344" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14" fill="#5A5470">Normal tab</text>

  <!-- logo + arrows -->
  <g transform="translate(456,132)">
    <rect width="48" height="48" rx="11" fill="url(#g)"/>
    <g fill="none" stroke="#F7F5FA" stroke-width="2.6" stroke-linecap="round" opacity="0.5" transform="scale(0.375)"><path d="M28 50V38a10 10 0 0 1 10-10h12"/><path d="M100 78v12a10 10 0 0 1-10 10H78"/></g>
    <rect x="15.75" y="15.75" width="16.5" height="16.5" rx="3.4" fill="#F7F5FA"/>
  </g>
  <path d="M432 156h16M508 156h16M520 150l6 6-6 6" fill="none" stroke="#B04AF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AFTER: thin title bar only -->
  <g transform="translate(540,36)" filter="url(#sh)">
    <rect width="380" height="280" rx="12" fill="#FFFFFF"/>
    <g clip-path="url(#cr)">
      <rect width="380" height="22" fill="#EFEDF3"/>
      <circle cx="16" cy="11" r="4.5" fill="#FF5F57"/><circle cx="30" cy="11" r="4.5" fill="#FEBC2E"/><circle cx="44" cy="11" r="4.5" fill="#28C840"/>
      <rect x="66" y="8" width="70" height="6" rx="3" fill="#C9BFD6"/>
      <use href="#page" y="22"/>
    </g>
  </g>
  <text x="730" y="344" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14" fill="#5A5470">Same tab, frameless</text>
</svg>
